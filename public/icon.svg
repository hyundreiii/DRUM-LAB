<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b18" />
      <stop offset="60%" stop-color="#0f0e0c" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="15%" stop-color="#d4d4d8" />
      <stop offset="70%" stop-color="#71717a" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <radialGradient id="headGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fafafa" />
      <stop offset="45%" stop-color="#e4e4e7" />
      <stop offset="85%" stop-color="#a1a1aa" />
      <stop offset="100%" stop-color="#52525b" />
    </radialGradient>
    <radialGradient id="cymbalGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6" />

  <!-- Outer Cymbal Accent Glow (Top Right) -->
  <circle cx="360" cy="150" r="100" fill="url(#cymbalGrad)" opacity="0.4" filter="url(#glow)" />
  <circle cx="360" cy="150" r="85" fill="none" stroke="#fef08a" stroke-width="2" opacity="0.3" />

  <!-- Drum Shell Base (Bottom 3D) -->
  <g filter="url(#dropShadow)">
    <path d="M 120 250 C 120 340 392 340 392 250 L 392 320 C 392 410 120 410 120 320 Z" fill="#18181b" />
    <path d="M 120 250 C 120 340 392 340 392 250 L 392 320 C 392 410 120 410 120 320 Z" fill="url(#goldGrad)" opacity="0.25" />
    
    <!-- Tension rods -->
    <line x1="150" y1="285" x2="150" y2="350" stroke="url(#rimGrad)" stroke-width="6" stroke-linecap="round" />
    <line x1="210" y1="300" x2="210" y2="370" stroke="url(#rimGrad)" stroke-width="6" stroke-linecap="round" />
    <line x1="302" y1="300" x2="302" y2="370" stroke="url(#rimGrad)" stroke-width="6" stroke-linecap="round" />
    <line x1="362" y1="285" x2="362" y2="350" stroke="url(#rimGrad)" stroke-width="6" stroke-linecap="round" />

    <!-- Drum Head (Snare Ellipse) -->
    <ellipse cx="256" cy="250" rx="140" ry="75" fill="url(#rimGrad)" />
    <ellipse cx="256" cy="250" rx="132" ry="68" fill="#18181b" />
    <ellipse cx="256" cy="250" rx="126" ry="62" fill="url(#headGrad)" />

    <!-- Center Dot / Reinforcement Ring -->
    <ellipse cx="256" cy="250" rx="36" ry="18" fill="#09090b" opacity="0.85" />
    <ellipse cx="256" cy="250" rx="30" ry="15" fill="none" stroke="#f59e0b" stroke-width="3" />
  </g>

  <!-- Crossed Drumsticks with Gold Finish -->
  <g filter="url(#dropShadow)">
    <!-- Stick 1 () -->
    <path d="M 100 130 L 400 370" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round" />
    <circle cx="95" cy="125" r="14" fill="#fef08a" />
    <line x1="100" y1="130" x2="400" y2="370" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- Stick 2 (/) -->
    <path d="M 412 130 L 112 370" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round" />
    <circle cx="417" cy="125" r="14" fill="#fef08a" />
    <line x1="412" y1="130" x2="112" y2="370" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Sound Shockwave Rings -->
  <ellipse cx="256" cy="250" rx="160" ry="85" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.4" stroke-dasharray="8 8" />
  <ellipse cx="256" cy="250" rx="180" ry="98" fill="none" stroke="#eab308" stroke-width="1.5" opacity="0.2" />

  <!-- Badge at Top -->
  <g transform="translate(256, 75)">
    <rect x="-65" y="-18" width="130" height="28" rx="14" fill="#0a0a0a" stroke="#f59e0b" stroke-width="2" />
    <text x="0" y="1" text-anchor="middle" fill="#fef08a" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" letter-spacing="2">REAL DRUM</text>
  </g>
</svg>